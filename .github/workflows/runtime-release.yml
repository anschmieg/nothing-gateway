name: Runtime bundle

on:
  push:
    tags: ['[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-[a-z0-9]*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-release.yml'
      - 'deploy/cli-proxy-api/**'
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || (!github.event.deleted && github.ref_type == 'tag')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.bundle.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Build and verify runtime bundle
        id: bundle
        env:
          BUNDLE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          bundle_tag="${BUNDLE_TAG:-$(date -u +%F)-dry-run}"
          bash deploy/cli-proxy-api/build-runtime-bundle.sh "$bundle_tag" release-assets
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: runtime-bundle
          path: release-assets/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: runtime-bundle
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          sha256sum --check SHA256SUMS
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)" = "$BUILT_COMMIT"
          gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
            --title "Gateway bundle $RELEASE_TAG" \
            --notes 'Verified Linux ARM64 CPA/CPAMC candidate. Not a production upgrade: see manifest for patch and test scope. No deployment was performed.' \
            "$RELEASE_TAG-linux-arm64.tar.gz" SHA256SUMS
